<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#18191A">
    
    <title>Catálogos | Villaser</title>

    <!-- Librería de Íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- CSS Global -->
    <link rel="stylesheet" href="../global.css">

    <!-- Detección de Tema Inmediato -->
    <script>
        (function() {
            const temaGuardado = localStorage.getItem('temaVillaser') || 'system';
            const prefiereClaro = window.matchMedia('(prefers-color-scheme: light)').matches;
            if (temaGuardado === 'light' || (temaGuardado === 'system' && prefiereClaro)) {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>

    <!-- SDKs de Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <!-- Puente de conexión centralizado -->
    <script src="../firebase-config.js"></script>

    <!-- Guardián de seguridad -->
    <script>
        firebase.auth().onAuthStateChanged(user => {
            if (!user || !user.emailVerified) window.location.replace('../index.html');
        });
    </script>
</head>
<body>

<div class="layout-wrapper">
    <main class="container">
        
        <!-- BARRA DE NAVEGACIÓN -->
        <nav class="corp-top-nav" style="justify-content: center;">
            <div class="corp-nav-title">
                <i class="fa-solid fa-book-open corp-accent-color"></i> CATÁLOGOS
            </div>
        </nav>

        <!-- BUSCADOR Y FILTRO POR RUBRO / MARCA -->
        <section class="corp-card">
            <div class="cat-header-tools">
                <span class="corp-card-title" style="margin: 0; font-size: 0.92rem;">
                    <i class="fa-solid fa-magnifying-glass corp-accent-color"></i> Buscador Técnico
                </span>
                <span id="catContador" class="cat-count-badge">0 archivos</span>
            </div>

            <div class="ap-search-box" style="margin-bottom: 10px;">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="catSearchInput" class="corp-input" placeholder="Buscar marca, línea, teclas, LED, caños..." autocomplete="off">
            </div>

            <div class="ap-chips-scroll" id="catChipsContainer" style="margin-bottom: 0;"></div>
        </section>

        <!-- ACCESO RÁPIDO: RECIENTES -->
        <section id="catRecientesCard" class="corp-card oculto">
            <div class="cat-header-tools" style="margin-bottom: 8px;">
                <span class="corp-card-title" style="margin: 0; font-size: 0.85rem;">
                    <i class="fa-solid fa-clock-rotate-left corp-accent-color"></i> Consultados Recientemente
                </span>
                <button type="button" id="btnLimpiarRecientes" class="pres-mini-act">
                    <i class="fa-solid fa-xmark"></i> Limpiar
                </button>
            </div>
            <div id="catRecientesList" class="cat-recents-strip"></div>
        </section>

        <!-- CONTENEDOR DINÁMICO DE CATÁLOGOS -->
        <div id="catListadoContainer" class="flex-column gap-15"></div>

    </main>
</div>

<!-- NOTIFICACIÓN TOAST CORPORATIVA -->
<div id="toastCorp" class="toast-corp">
    <i id="toastIcon" class="fa-solid fa-circle-check toast-icon"></i>
    <div>
        <div id="toastTitle" class="toast-title">Listo</div>
        <div id="toastMsg" class="toast-msg">Acción realizada</div>
    </div>
</div>

<!-- MENÚ INFERIOR TIPO APP -->
<nav class="corp-bottom-nav">
    <div class="corp-scroll-container" id="corpFooterMenu"></div>
</nav>

<script src="script.js"></script>

</body>
</html>
