<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gestión de Lista de Precios - Villaser</title>
    
    <!-- CSS Global de tu PWA -->
    <link rel="stylesheet" href="../global.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- SDKs de Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="../firebase-config.js"></script>

    <!-- Guardián de Seguridad (Solo Administrador) -->
    <script>
        const ADMIN_EMAIL = "sergio@villaser.com.ar"; // <-- MISMO CORREO QUE EN APPS SCRIPT
        firebase.auth().onAuthStateChanged(user => {
            if (!user || !user.emailVerified || user.email !== ADMIN_EMAIL) {
                window.location.replace('../index.html');
            }
        });
    </script>

    <style>
        /* Estilos específicos compactos para selector de columnas y lista editable */
        .cols-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-top: 8px;
        }
        .col-check-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--ngc-bg-input);
            border: 1px solid var(--ngc-privacy-border);
            padding: 8px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            color: var(--ngc-text-main);
            transition: all 0.2s;
        }
        .col-check-item input[type="checkbox"] {
            accent-color: var(--ngc-neon);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
        .col-check-item.active {
            border-color: var(--ngc-neon);
            background: rgba(var(--ngc-neon-rgb), 0.12);
            font-weight: 600;
        }
        .concepto-edit-card {
            background: var(--ngc-bg-input);
            border: 1px solid var(--ngc-privacy-border);
            border-left: 3px solid var(--ngc-neon);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .concepto-edit-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
        }
        .badge-codigo {
            font-size: 0.7rem;
            background: var(--ngc-neon);
            color: #000;
            padding: 2px 7px;
            border-radius: 4px;
            font-weight: 700;
            white-space: nowrap;
        }
        .input-editable:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            border-style: dashed;
        }
        .input-editable:not(:disabled) {
            border-color: var(--ngc-warning);
            background: rgba(245, 195, 59, 0.08);
        }
    </style>
</head>
<body>

    <!-- PANTALLA DE CARGA -->
    <div id="loading" class="loading-screen">
        <i class="fa-solid fa-circle-notch fa-spin" style="font-size: 2.5rem; color: var(--ngc-neon); margin-bottom: 15px;"></i>
        <p style="color: var(--ngc-text-main); font-weight: 600;">Conectando con Base de Precios...</p>
    </div>

    <!-- CONTENEDOR PRINCIPAL -->
    <div id="app" class="layout-wrapper oculto">
        
        <!-- BARRA SUPERIOR -->
        <header class="top-bar">
            <button class="btn-back" onclick="window.location.href='../index.html'">
                <i class="fa-solid fa-arrow-left"></i> Inicio
            </button>
            <h2 class="module-title"><i class="fa-solid fa-sliders corp-accent-color"></i> Editor de Precios</h2>
            <button class="btn-back" onclick="cargarDatosSheet()" title="Recargar datos">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
        </header>

        <!-- TARJETA 1: SELECTOR DE COLUMNA (CASILLA ÚNICA) Y TEMA -->
        <div class="corp-card gpu-accel">
            <h4 class="corp-card-title"><i class="fa-solid fa-filter corp-accent-color"></i> 1. Configurar Edición</h4>
            
            <!-- Selector de Campo / Columna (Solo 1 seleccionable) -->
            <div class="row-group">
                <label>Campo a modificar (Seleccione 1 columna)</label>
                <div id="contenedorColumnas" class="cols-grid">
                    <!-- Se genera dinámicamente por JS -->
                </div>
            </div>

            <!-- Selector de Tema (Acordeón Corporativo) -->
            <div class="row-group" style="margin-bottom: 0;">
                <label>Seleccionar Tema / Rubro</label>
                <details id="detTema" class="corp-custom-select">
                    <summary id="sumTema" class="corp-input">-- SELECCIONE UN TEMA --</summary>
                    <div id="listTema" class="corp-select-list"></div>
                </details>
                <input type="hidden" id="selTema" value="">
            </div>
        </div>

        <!-- TARJETA 2: LISTADO DE CONCEPTOS COINCIDENTES -->
        <div id="cardResultados" class="corp-card gpu-accel oculto">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <h4 class="corp-card-title" style="margin: 0;"><i class="fa-solid fa-list-check corp-accent-color"></i> 2. Conceptos (<span id="contadorConceptos">0</span>)</h4>
                <span id="badgeColumnaActiva" style="font-size: 0.75rem; color: var(--ngc-warning); font-weight: 700;"></span>
            </div>

            <div id="listaConceptos"></div>

            <!-- BOTÓN EDITAR / GUARDAR CAMBIOS -->
            <div style="margin-top: 15px;">
                <button type="button" id="btnEditarGuardar" class="corp-btn" style="width: 100%; background: var(--ngc-neon); color: #000; font-weight: 700;" onclick="manejarBotonEditarGuardar()">
                    <i class="fa-solid fa-pen-to-square"></i> Editar
                </button>
            </div>
        </div>

        <!-- BOTÓN NUEVO CONCEPTO / TEMA -->
        <div class="corp-card gpu-accel" style="text-align: center;">
            <button type="button" class="corp-btn success-btn" style="width: 100%; font-weight: 700;" onclick="abrirModalNuevo()">
                <i class="fa-solid fa-plus-circle"></i> Nuevo
            </button>
        </div>

    </div>

    <!-- ===================================================================== -->
    <!-- MODAL: NUEVO TEMA O NUEVO CONCEPTO CON CÓDIGO CORRELATIVO AUTOMÁTICO  -->
    <!-- ===================================================================== -->
    <div id="modalNuevo" class="modal-overlay oculto gpu-accel">
        <div class="corp-modal-card" style="max-width: 500px; width: 92%; max-height: 88vh; overflow-y: auto; text-align: left;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid var(--ngc-privacy-border); padding-bottom: 10px;">
                <h3 style="margin: 0; font-size: 1.1rem;"><i class="fa-solid fa-folder-plus corp-accent-color"></i> Cargar Nuevo Registro</h3>
                <button type="button" class="btn-delete" onclick="cerrarModalNuevo()"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <!-- PASO 1: PREGUNTA SI EL TEMA YA EXISTE -->
            <div class="row-group">
                <label style="color: var(--ngc-warning);">¿El Tema ya existe en la planilla?</label>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px;">
                    <button type="button" id="btnTemaExistente" class="corp-btn" style="border: 1px solid var(--ngc-neon); background: rgba(var(--ngc-neon-rgb), 0.15);" onclick="seleccionarTipoTema(true)">
                        <i class="fa-solid fa-check"></i> Sí, ya existe
                    </button>
                    <button type="button" id="btnTemaNuevo" class="corp-btn" onclick="seleccionarTipoTema(false)">
                        <i class="fa-solid fa-plus"></i> No, tema nuevo
                    </button>
                </div>
            </div>

            <!-- CONTENEDOR TEMA EXISTENTE -->
            <div id="bloqueTemaExistente" class="row-group">
                <label>Seleccionar Tema Existente (Col C)</label>
                <details id="detNuevoTema" class="corp-custom-select">
                    <summary id="sumNuevoTema" class="corp-input">-- SELECCIONE TEMA --</summary>
                    <div id="listNuevoTema" class="corp-select-list"></div>
                </details>
                <input type="hidden" id="inputNuevoTemaSelect" value="">
            </div>

            <!-- CONTENEDOR TEMA NUEVO -->
            <div id="bloqueTemaNuevo" class="row-group oculto">
                <label>Nombre del Nuevo Tema (Col C)</label>
                <input type="text" id="inputNuevoTemaTexto" class="corp-input" placeholder="Ej: AUTOMATIZACIÓN Y DOMÓTICA" oninput="calcularCodigoCorrelativo()">
            </div>

            <!-- CÓDIGO GENERADO AUTOMÁTICAMENTE (COL A) -->
            <div class="row-group">
                <label>Código Correlativo Automático (Col A)</label>
                <input type="text" id="newCodigo" class="corp-input" style="font-weight: 700; color: var(--ngc-neon);" placeholder="Se genera al elegir tema...">
                <small id="ayudaCodigo" style="color: var(--ngc-text-faded); font-size: 0.72rem;"></small>
            </div>

            <!-- RESTO DE LOS CAMPOS (B, D, E, F, G, H, I, J, K, L, M) -->
            <div class="row-group">
                <label>Concepto / Descripción del Trabajo (Col D) *</label>
                <input type="text" id="newConcepto" class="corp-input" placeholder="Ej: Instalación de interruptor WiFi">
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div class="row-group">
                    <label>Importe Neto $ (Col E)</label>
                    <input type="number" id="newImporte" class="corp-input" placeholder="0">
                </div>
                <div class="row-group">
                    <label>Horas / Minutos (Col G)</label>
                    <input type="text" id="newHoras" class="corp-input" placeholder="Ej: 60">
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div class="row-group">
                    <label>Fuentes (Col B)</label>
                    <input type="text" id="newFuentes" class="corp-input" placeholder="Ej: AEA / Propia">
                </div>
                <div class="row-group">
                    <label>Código 2 (Col H)</label>
                    <input type="text" id="newCodigo2" class="corp-input" placeholder="Opcional">
                </div>
            </div>

            <div class="row-group">
                <label>Notas Aclaratorias Internas (Col F)</label>
                <textarea id="newNotas" class="corp-input" rows="2" placeholder="Notas técnicas..."></textarea>
            </div>

            <div class="row-group">
                <label>Notas Aclaratorias en Presupuesto (Col K)</label>
                <textarea id="newNotasPresupuesto" class="corp-input" rows="2" placeholder="Texto visible en PDF..."></textarea>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div class="row-group">
                    <label>Portabilidad (Col I)</label>
                    <input type="text" id="newPortabilidad" class="corp-input" placeholder="Opcional">
                </div>
                <div class="row-group">
                    <label>Ampliación Portabilidad (Col J)</label>
                    <input type="text" id="newAmpPortabilidad" class="corp-input" placeholder="Opcional">
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div class="row-group">
                    <label>Organización (Col L)</label>
                    <input type="text" id="newOrganizacion" class="corp-input" placeholder="Ej: Villaser">
                </div>
                <div class="row-group">
                    <label>Mostrar (Col M)</label>
                    <input type="text" id="newMostrar" class="corp-input" value="SI">
                </div>
            </div>

            <div class="corp-modal-actions" style="margin-top: 15px;">
                <button type="button" id="btnGuardarNuevo" class="corp-btn success-btn" onclick="guardarNuevoRegistro()">
                    <i class="fa-solid fa-floppy-disk"></i> Guardar en Planilla
                </button>
                <button type="button" class="corp-btn" onclick="cerrarModalNuevo()">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- TOAST / CARTEL FLOTANTE DE NOTIFICACIÓN -->
    <div id="toastNotificacion" class="toast-corp oculto">
        <i id="toastIcon" class="fa-solid fa-check-circle"></i>
        <div>
            <strong id="toastTitle" style="display: block; font-size: 0.85rem;">Listo</strong>
            <span id="toastMessage" style="font-size: 0.78rem; color: var(--ngc-text-faded);"></span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
