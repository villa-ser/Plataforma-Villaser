<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#18191A">
    
    <title>Proveedores | Villaser</title>
    
    <!-- Iconos y CSS Global -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../global.css">

    <!-- Script de ejecución inmediata para el tema -->
    <script>
    (function() {
        const temaGuardado = localStorage.getItem('temaVillaser') || 'system';
        const prefiereClaro = window.matchMedia('(prefers-color-scheme: light)').matches;
        if (temaGuardado === 'light' || (temaGuardado === 'system' && prefiereClaro)) {
            document.documentElement.setAttribute('data-theme', 'light');
        }
    })();
    </script>
</head>
<body>
    <div class="layout-wrapper">
        <main class="container">
            
            <!-- BARRA DE NAVEGACIÓN ESTANDARIZADA -->
            <nav class="corp-top-nav">
                <button class="corp-btn-icon" onclick="window.location.replace('../index.html')" aria-label="Volver al inicio" title="Inicio">
                    <i class="fa-solid fa-house"></i>
                </button>
                <div class="corp-nav-title">
                    <i class="fa-solid fa-truck-fast corp-accent-color"></i> PROVEEDORES
                </div>
                <button id="btnSyncProv" class="corp-btn-icon" onclick="sincronizarManual()" aria-label="Sincronizar proveedores" title="Actualizar base">
                    <i class="fa-solid fa-rotate"></i>
                </button>
            </nav>

            <!-- INDICADOR DE CARGA ESTANDARIZADO -->
            <div id="loading" aria-live="polite" class="corp-card" style="text-align: center; padding: 40px 20px;">
                <i class="fa-solid fa-satellite-dish fa-spin" style="color: var(--ngc-neon); font-size: 2rem; margin-bottom: 15px;"></i>
                <br><span style="color: var(--ngc-text-faded); font-size: 0.9rem; text-transform: uppercase; font-weight: bold;">Sincronizando Proveedores...</span>
            </div>
            
            <div id="app" style="display:none; flex-direction: column; gap: 12px;">
                
                <!-- BUSCADOR UNIVERSAL Y FILTROS RÁPIDOS -->
                <section class="corp-card" style="position: sticky; top: 8px; z-index: 20;">
                    <div class="cat-header-tools">
                        <h4 class="corp-card-title" style="margin: 0;">
                            <i class="fa-solid fa-magnifying-glass corp-accent-color"></i> Casas de Electricidad
                        </h4>
                        <span id="syncStatusPill" class="cat-count-badge">0 locales</span>
                    </div>
                    
                    <div class="row-group" style="margin-bottom: 10px;">
                        <label for="searchInput">Buscar por nombre, barrio, calle, rubro o teléfono</label>
                        <div class="ap-search-box" style="position: relative;">
                            <i class="fa-solid fa-magnifying-glass"></i>
                            <input type="text" id="searchInput" class="corp-input" style="padding-right: 38px;" placeholder="Ej: General Paz, San Martín, LED..." oninput="filtrarCasas()" autocomplete="off">
                            <button type="button" id="btnClearSearch" class="oculto" onclick="limpiarBusqueda()" aria-label="Limpiar búsqueda" style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: transparent; border: none; color: var(--ngc-text-faded); width: 28px; height: 28px; cursor: pointer; font-size: 0.95rem;">
                                <i class="fa-solid fa-circle-xmark"></i>
                            </button>
                        </div>
                    </div>

                    <!-- PÍLDORAS DESLIZABLES DE FILTRO (TODOS / FAVORITOS / BARRIOS) -->
                    <div id="barrioChipsContainer" class="ap-chips-scroll" style="margin-bottom: 10px;"></div>
                    
                    <!-- ACCIONES DE DIRECTORIO -->
                    <div style="display: flex; gap: 8px;">
                        <button id="btnVerTodos" class="corp-btn" style="color: var(--ngc-warning); background: rgba(245, 195, 59, 0.1);" onclick="mostrarListadoAgrupado()">
                            <i class="fa-solid fa-list"></i> Ver Listado Completo por Barrios
                        </button>
                        <button id="btnToggleAcordeones" class="corp-btn-icon oculto" onclick="alternarTodosLosBarrios()" title="Expandir o contraer barrios" aria-label="Expandir o contraer barrios" style="flex-shrink: 0;">
                            <i class="fa-solid fa-angles-down"></i>
                        </button>
                    </div>
                </section>

                <!-- PANEL INICIAL RÁPIDO (FAVORITOS, RECIENTES Y ACCESO POR BARRIO) -->
                <section id="homeQuickPanel" class="flex-column gap-15"></section>

                <!-- CONTENEDOR DE RESULTADOS / LISTADO AGRUPADO -->
                <section id="resultadosContainer" style="display: none; flex-direction: column; gap: 12px;"></section>

            </div>
        </main>
    </div>

    <!-- MENÚ INFERIOR TIPO APP -->
    <nav class="corp-bottom-nav">
        <div class="corp-scroll-container" id="corpFooterMenu"></div>
    </nav>

    <!-- TOAST CORPORATIVO -->
    <div id="toastCorp" class="toast-corp" role="status" aria-live="polite">
        <i id="toastIcon" class="fa-solid fa-circle-check toast-icon"></i>
        <div>
            <div id="toastTitle" class="toast-title">Listo</div>
            <div id="toastMsg" class="toast-msg">Operación completada.</div>
        </div>
    </div>
    
    <!-- ================================================== -->
    <!-- MODAL VISOR DE MAPA A PANTALLA COMPLETA            -->
    <!-- ================================================== -->
    <div id="modalVisorMapa" class="oculto" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000000; z-index: 2147483647; display: none; flex-direction: column; overflow: hidden;">
        
        <!-- Barra superior adaptada con acceso directo a GPS externo -->
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 10px; background: #18191A; padding: 12px 14px; border-bottom: 1px solid var(--ngc-privacy-border); flex-shrink: 0; width: 100%; box-sizing: border-box;">
            <span style="color: #ffffff; font-weight: 700; font-size: 0.92rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1;" id="mapaTitle">
                <i class="fa-solid fa-map-location-dot corp-accent-color"></i> Ubicación
            </span>
            <div style="display: flex; align-items: center; gap: 8px; flex-shrink: 0;">
                <a id="btnAbrirMapsExterno" href="#" target="_blank" rel="noopener noreferrer" class="corp-btn primary-action" style="width: auto; padding: 8px 12px; margin: 0; border-radius: 20px; font-size: 0.8rem; text-decoration: none;">
                    <i class="fa-solid fa-diamond-turn-right"></i> GPS
                </a>
                <button onclick="cerrarMapaInterno()" class="corp-btn danger-btn" style="width: auto; padding: 8px 14px; margin: 0; border-radius: 20px; font-size: 0.8rem; font-weight: bold;">
                    <i class="fa-solid fa-arrow-left"></i> Volver
                </button>
            </div>
        </div>

        <!-- Contenedor del Iframe de Google Maps -->
        <div style="position: relative; width: 100%; height: calc(100dvh - 62px); background: #ffffff;">
            <!-- Spinner de carga -->
            <div id="visorLoaderMapa" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: var(--ngc-neon); text-align: center; z-index: 1;">
                <i class="fa-solid fa-circle-notch fa-spin fa-3x"></i>
                <p style="margin-top: 15px; font-size: 0.9rem; font-weight: bold; color: #333;">Cargando Mapa...</p>
            </div>
            
            <!-- Iframe embebido -->
            <iframe id="iframeMapa" src="" style="width: 100%; height: 100%; border: none; display: block; position: relative; z-index: 2; opacity: 0; transition: opacity 0.3s ease;" onload="ocultarLoaderMapa()"></iframe>
        </div>
    </div>

    <!-- Librerías de Firebase Unificadas (Compatibles con toda la PWA) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    
    <!-- Puente de Conexión a la Nube -->
    <script src="../firebase-config.js"></script>
    <script src="script.js"></script>
</body>
  </html>
