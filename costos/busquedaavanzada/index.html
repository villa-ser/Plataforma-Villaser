<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#18191A">
    
    <title>Búsqueda Avanzada | Villaser</title>
    
    <!-- Iconos y CSS Global -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../../global.css">

    <!-- Script de ejecución inmediata para el tema -->
    <script>
    (function() {
        const temaGuardado = localStorage.getItem('temaVillaser') || 'system';
        const prefiereClaro = window.matchMedia('(prefers-color-scheme: light)').matches;
        
        if (temaGuardado === 'light' || (temaGuardado === 'system' && prefiereClaro)) {
            document.documentElement.setAttribute('data-theme', 'light');
        }
    })();
    </script>

    <!-- SDKs de Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <!-- Guardián de Seguridad -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB993KWlnMrN5hwRKjL-OmTZ95F7v_FFk0",
            authDomain: "villaser-gestion.firebaseapp.com",
            projectId: "villaser-gestion",
            storageBucket: "villaser-gestion.firebasestorage.app",
            messagingSenderId: "1032102638132",
            appId: "1:1032102638132:web:dd3a89e1c6a67de7d35061"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        firebase.auth().onAuthStateChanged(user => {
            if (!user || !user.emailVerified) {
                window.location.replace('../../index.html'); 
            }
        });
    </script>
</head>
<body>

<!-- TOAST CORPORATIVO -->
<div id="corpToast" class="toast-corp">
    <i class="fa-solid fa-circle-check toast-icon"></i>
    <div>
        <div id="toastTitle" class="toast-title">Listo</div>
        <div id="toastMsg" class="toast-msg">Operación completada.</div>
    </div>
</div>

<!-- SPLASH DE CARGA FLOTANTE -->
<div id="loading" class="modal-overlay" style="background: var(--bg-body); z-index: 9998;">
    <div class="corp-card" style="text-align: center; padding: 32px 24px; max-width: 300px; border-bottom: 4px solid var(--ngc-neon);">
        <i class="fa-solid fa-magnifying-glass-plus" style="color: var(--ngc-neon); font-size: 2.3rem; margin-bottom: 12px;"></i>
        <h3 style="font-size: 1rem; color: var(--ngc-text-main); text-transform: uppercase; margin-bottom: 8px;">Búsqueda Avanzada</h3>
        <span style="color: var(--ngc-text-faded); font-size: 0.82rem; display: flex; align-items: center; justify-content: center; gap: 8px;">
            <i class="fa-solid fa-circle-notch fa-spin" style="color: var(--ngc-neon);"></i> Cargando catálogo...
        </span>
    </div>
</div>

<div class="layout-wrapper">
    <main class="container">

        <!-- BARRA DE NAVEGACIÓN SUPERIOR -->
        <nav class="corp-top-nav">
            <button type="button" class="corp-btn-icon" onclick="window.location.href='../index.html'" title="Volver a Mano de Obra" aria-label="Volver">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <div class="corp-nav-title">
                <i class="fa-solid fa-magnifying-glass-plus corp-accent-color"></i> BÚSQUEDA AVANZADA
            </div>
            <button type="button" class="corp-btn-icon danger" onclick="limpiarBusqueda()" title="Limpiar Búsqueda" aria-label="Limpiar">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
        </nav>

        <!-- CONTENIDO PRINCIPAL DEL BUSCADOR -->
        <div id="app" class="oculto flex-column gap-15">
            
            <!-- TARJETA DEL BUSCADOR -->
            <section class="corp-card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                    <h4 class="corp-card-title" style="margin: 0;">
                        <i class="fa-solid fa-magnifying-glass corp-accent-color"></i> Buscador Inteligente
                    </h4>
                    <span id="resultsCountBadge" class="cat-count-badge oculto">0</span>
                </div>
                
                <div class="row-group" style="margin-bottom: 0;">
                    <label for="searchInput">¿Qué trabajo necesitás cotizar?</label>
                    <div style="display: flex; flex-direction: column; gap: 10px; position: relative;">
                        <input type="text" id="searchInput" class="corp-input" placeholder="Ej: pilar trifásico, tablero, jabalina..." disabled autocomplete="off">
                        <ul id="suggestionsList" class="corp-suggestions-list oculto"></ul>

                        <button type="button" id="btnBuscar" class="corp-btn primary-action" style="width: 100%;" disabled>
                            <i class="fa-solid fa-magnifying-glass"></i> Buscar Precio
                        </button>
                    </div>
                </div>

                <!-- Filtro por Fuente / Organización -->
                <div style="margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--ngc-privacy-border);">
                    <span style="font-size: 0.75rem; color: var(--ngc-text-faded); display: block; margin-bottom: 8px; font-weight: 700; text-transform: uppercase;">Filtrar por fuente:</span>
                    <div id="fuentesChipsBar" class="ap-chips-scroll" style="margin-bottom: 0;"></div>
                </div>

                <!-- Búsquedas rápidas -->
                <div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--ngc-privacy-border);">
                    <span style="font-size: 0.75rem; color: var(--ngc-text-faded); display: block; margin-bottom: 8px; font-weight: 700; text-transform: uppercase;">Búsquedas rápidas:</span>
                    <div style="display: flex; flex-wrap: wrap; gap: 8px;">
                        <button type="button" class="corp-btn-small" onclick="busquedaRapida('Apto electrico')">Apto Eléctrico</button>
                        <button type="button" class="corp-btn-small" onclick="busquedaRapida('Armado de Pilar')">Armado de Pilar</button>
                        <button type="button" class="corp-btn-small" onclick="busquedaRapida('Tablero')">Tableros</button>
                        <button type="button" class="corp-btn-small" onclick="busquedaRapida('Toma')">Tomas</button>
                        <button type="button" class="corp-btn-small" onclick="busquedaRapida('Jabalina')">Jabalina</button>
                    </div>
                </div>
            </section>

            <!-- CONTENEDOR DE RESULTADOS -->
            <div id="resultsContainer" class="flex-column gap-15"></div>

        </div>
    </main>
</div>

<nav class="corp-bottom-nav">
    <div class="corp-scroll-container" id="corpFooterMenu"></div>
</nav>

<script src="script.js" defer></script>
</body>
</html>
